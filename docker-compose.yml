# Generic SYCL llama-server. Copy .env.example or examples/z8g4.env to .env.
#
# Devices: pass ONLY the chosen Intel render nodes (DRI_RENDER_*).
# Mount the whole /dev/dri/by-path folder (PCI names contain colons, which
# break per-device short "src:dst:mode" binds and even some long-syntax
# interpolations). Do not bind all of /dev/dri on hosts that also have
# NVIDIA / extra Intel nodes (e.g. z8g4).
#
# ipc: host is intentionally omitted. llama-server is a single process using
# two Level Zero devices; host IPC is a leftover from vLLM multiprocessing
# and is not required for this path. shm_size is kept for SYCL/USM staging.

services:
  llama-sycl:
    build:
      context: .
      target: runtime
      args:
        BUILD_JOBS: ${BUILD_JOBS:-24}
    image: ${IMAGE_NAME:-qwen38-b70:latest}
    container_name: ${CONTAINER_NAME:-qwen38-b70}
    restart: unless-stopped
    init: true
    devices:
      - ${DRI_RENDER_0}:/dev/dri/${DRI_RENDER_0_NAME}
      - ${DRI_RENDER_1}:/dev/dri/${DRI_RENDER_1_NAME}
    volumes:
      # Whole-folder bind: individual pci-0000:XX:00.0-render names contain
      # colons and make Compose report "invalid volume specification".
      - /dev/dri/by-path:/dev/dri/by-path:ro
      - type: bind
        source: ${HOST_MODELS_DIR}
        target: /models
    environment:
      MODELS_DIR: /models
      GPU_COUNT: ${GPU_COUNT:-2}
      CTX_SIZE: ${CTX_SIZE:-262144}
      CTX_SIZE_OVERRIDE: ${CTX_SIZE_OVERRIDE:-}
      PARALLEL: ${PARALLEL:-1}
      BATCH: ${BATCH:-8192}
      UBATCH: ${UBATCH:-8192}
      PORT: ${PORT:-8016}
      ENABLE_MTP: ${ENABLE_MTP:-0}
      SPEC_DRAFT_N_MAX: ${SPEC_DRAFT_N_MAX:-5}
      THREADS: ${THREADS:-16}
      DRAFT_THREADS: ${DRAFT_THREADS:-16}
      DRAFT_NGL: ${DRAFT_NGL:-0}
      ENABLE_VISION: ${ENABLE_VISION:-0}
      SKIP_DOWNLOAD: ${SKIP_DOWNLOAD:-0}
      MODEL_REPO: ${MODEL_REPO:-ggml-org/Qwen3.8-27B-GGUF}
      MODEL_REV: ${MODEL_REV:-0669b98607d47046c7c2b3f801011d54a08cfccf}
      MODEL_FILE: ${MODEL_FILE:-Qwen3.8-27B-Q4_K_M.gguf}
      MODEL_SHA256: ${MODEL_SHA256:-31629f53165ab6a7dad8c9847dcfd1fdf55829dac1e6e748f4a68581b0033d34}
      MTP_REPO: ${MTP_REPO:-ggml-org/Qwen3.8-27B-GGUF}
      MTP_REV: ${MTP_REV:-0669b98607d47046c7c2b3f801011d54a08cfccf}
      MTP_FILE: ${MTP_FILE:-mtp-Qwen3.8-27B-Q4_0.gguf}
      MTP_SHA256: ${MTP_SHA256:-}
      MMPROJ_FILE: ${MMPROJ_FILE:-mmproj-Qwen3.8-27B-Q8_0.gguf}
      MMPROJ_SHA256: ${MMPROJ_SHA256:-}
      HF_TOKEN: ${HF_TOKEN:-}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      GGML_SYCL_COMM_SINGLE_KERNEL: ${GGML_SYCL_COMM_SINGLE_KERNEL:-1}
      GGML_SYCL_COMM_DIRECT_Q8: ${GGML_SYCL_COMM_DIRECT_Q8:-2}
      GGML_SYCL_DEV2DEV_MEMCPY: ${GGML_SYCL_DEV2DEV_MEMCPY:-0}
    shm_size: ${SHM_SIZE:-8g}
    ports:
      - "${HOST_PORT:-8016}:${PORT:-8016}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os,urllib.request as u; req=u.Request(\"http://127.0.0.1:%s/health\" % os.environ.get(\"PORT\",\"8016\")); k=os.environ.get(\"LLAMA_API_KEY\"); req.add_header(\"Authorization\", \"Bearer \"+k) if k else None; u.urlopen(req)'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
